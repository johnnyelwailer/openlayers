<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>compat-matrix</title>
    <style>
      :root {
        --ok: #1b8a3a;
        --error: #c92a2a;
        --unavailable: #868e96;
        --bg: #f8f9fa;
        --border: #dee2e6;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #212529;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: #fff;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      input {
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        min-width: 260px;
      }
      main {
        padding: 12px 16px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        background: #fff;
        border: 1px solid var(--border);
      }
      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      th {
        position: sticky;
        top: 52px;
        background: #fff;
        z-index: 5;
      }
      .cell {
        font-weight: 600;
      }
      .ok {
        color: var(--ok);
      }
      .error {
        color: var(--error);
      }
      .not-supported {
        color: var(--error);
      }
      .unavailable {
        color: var(--unavailable);
      }
      .details {
        white-space: pre-wrap;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        color: #495057;
      }
      .muted {
        color: #868e96;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <strong>Renderer compatibility matrix</strong>
        <span id="meta" class="muted"></span>
        <input id="filter" placeholder="Filter (e.g. stroke-width, point, var)" />
      </div>
    </header>
    <main>
      <table id="table"></table>
    </main>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
